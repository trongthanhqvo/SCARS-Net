schema_version: 1.0.0
fit_scope: source_only
freeze_before_target: true
execution_seed_contract:
  source_instability:
    window_order: recording_id_lexicographic_earliest_valid_window
    fold_base_seed: 24021+10000*fold_index
    case_seed: fold_base_seed+case_index
    generator_scope: one_generator_per_case_consumed_in_window_order
    paired_across_configurations: true
  family_teacher_cycle:
    window_order: capped_source_fit_pool_manifest_recording_order_then_start
    fold_base_seed: 70000+fold_index
    case_index: window_index_mod_registered_case_count
    window_seed: fold_base_seed+window_index
  calibration_relations:
    window_order: recording_id_lexicographic_earliest_valid_window
    fold_base_seed: 75000+fold_index
    cell_seed: fold_base_seed+1009*window_index+case_index
  source_fit_relations:
    window_order: recording_id_lexicographic_earliest_valid_window
    fold_base_seed: 80000+fold_index
    cell_seed: fold_base_seed+1009*window_index+case_index
  target_robustness_snr_sir:
    window_order: sealed_target_cache_recording_order_then_start
    seed: 26000+101*severity_index+window_index
    authorization_required: true
  target_registered_nuisances:
    window_order: sealed_target_cache_recording_order_then_start
    seed: 36000+1009*case_index+window_index
    authorization_required: true
aggregation:
  window: median_within_recording
  recording: median_within_source_domain
  domain: equal_weight_mean
  nuisance: maximum_over_registered_nuisance_severity_pairs
normalization:
  range: source_global_percentile_clip_0_1_per_family
  formula: median_within_recording_of_family_linf_delta
  family_aggregation: maximum_over_active_families
  coefficient_append_invariant: true
nuisances:
  - id: awgn
    mathematical_transform: y=x+n; n=sqrt(Px/10^(snr_db/10)/2)*(u+jv); u,v~N(0,I)
    random_variables: independent_standard_normal_real_and_imaginary_samples
    normalization: noise_scaled_to_measured_mean_window_power_Px_with_floor_1e-12
    seed_policy: numpy_generator_from_registered_base_seed; source_instability=fold_base+case_index_in_recording_id_lexicographic_order_shared_across_configurations; relation=base+1009*window_index+case_index
    failure_conditions: finite_complex_input_and_finite_registered_severity_required
    parameter: snr_db
    severities: [20, 10, 0, -10]
    units: dB
    scale_type: physical_relative_to_source_window_power
    limit_source: pre-specified engineering stress grid; not inferred from target data
    applicable_when: complex_iq_verified
  - id: colored_noise
    mathematical_transform: y=x+beta*(h*w); h=[0.2,0.6,0.2]/||h||2; valid_convolution
    random_variables: complex_white_standard_normal_length_N_plus_2
    normalization: beta_sets_filtered_noise_power_to_Px/10^(snr_db/10); power_floors_1e-12
    seed_policy: numpy_generator_from_registered_base_seed; source_instability=fold_base+case_index_in_recording_id_lexicographic_order_shared_across_configurations; relation=base+1009*window_index+case_index
    failure_conditions: finite_complex_input_and_finite_registered_severity_required
    parameter: snr_db
    severities: [20, 10, 0]
    units: dB
    scale_type: physical_relative_to_source_window_power
    limit_source: pre-specified engineering stress grid; FIR coefficients frozen in config hash
    applicable_when: complex_iq_verified
  - id: multipath
    mathematical_transform: y=a0*x+a1*roll(x,delay); [a0,a1]=[1,0.5*exp(j*phi)]/sqrt(1.25)
    random_variables: phi~Uniform(-pi,pi); delay_is_exact_not_a_random_maximum
    normalization: two_taps_have_unit_total_energy; circular_delay_boundary
    seed_policy: numpy_generator_from_registered_base_seed; source_instability=fold_base+case_index_in_recording_id_lexicographic_order_shared_across_configurations; relation=base+1009*window_index+case_index
    failure_conditions: finite_complex_input_and_finite_registered_severity_required
    parameter: delay_samples
    severities: [1, 4, 8]
    units: samples
    scale_type: normalized_until_sample_rate_manifest_is_complete
    limit_source: conservative discrete stress grid; convert to seconds per dataset in real manifest
    applicable_when: complex_iq_verified
  - id: flat_fading
    mathematical_transform: y=amplitude*x*exp(j*phi)
    random_variables: phi~Uniform(-pi,pi); amplitude_is_fixed_by_severity_not_Rayleigh_or_Rician
    normalization: no_post_transform_power_normalization
    seed_policy: numpy_generator_from_registered_base_seed; source_instability=fold_base+case_index_in_recording_id_lexicographic_order_shared_across_configurations; relation=base+1009*window_index+case_index
    failure_conditions: finite_complex_input_and_finite_registered_severity_required
    parameter: amplitude_scale
    severities: [0.9, 0.7, 0.5]
    units: relative_amplitude
    scale_type: normalized
    limit_source: pre-specified amplitude stress grid
    applicable_when: complex_iq_verified
  - id: carrier_frequency_offset
    mathematical_transform: y[n]=x[n]*exp(j*2*pi*delta*n)
    random_variables: none
    normalization: unit_modulus_multiplication
    seed_policy: no_random_variable; generator_argument_ignored
    failure_conditions: finite_complex_input_and_finite_registered_severity_required
    parameter: cycles_per_sample
    severities: [0.0001, 0.0005, 0.001]
    units: cycles_per_sample
    scale_type: normalized; report Hz using verified sample rate
    limit_source: pre-specified small-offset stress grid; target independent
    applicable_when: complex_iq_verified
  - id: global_phase
    mathematical_transform: y=x*exp(j*phi)
    random_variables: none
    normalization: unit_modulus_multiplication
    seed_policy: no_random_variable; generator_argument_ignored
    failure_conditions: finite_complex_input_and_finite_registered_severity_required
    parameter: phase_rad
    severities: [0.7853981634, 1.5707963268, 3.1415926536]
    units: radians
    scale_type: physical
    limit_source: exact phase-rotation coverage
    applicable_when: complex_iq_verified
  - id: timing_offset
    mathematical_transform: y=roll(x,int(shift_samples))
    random_variables: none
    normalization: circular_boundary; length_preserved
    seed_policy: no_random_variable; generator_argument_ignored
    failure_conditions: finite_complex_input_and_finite_registered_severity_required
    parameter: shift_samples
    severities: [1, 4, 16]
    units: samples
    scale_type: normalized_until_sample_rate_manifest_is_complete
    limit_source: pre-specified discrete offsets
    applicable_when: all_waveform_inputs
  - id: time_scaling
    mathematical_transform: query=(n-center)/(1+fraction)+center; real_and_imag_linear_interpolation
    random_variables: none
    normalization: fixed_length_output; zero_extrapolation_outside_input_support
    seed_policy: no_random_variable; generator_argument_ignored
    failure_conditions: finite_complex_input_and_finite_registered_severity_required
    parameter: fractional_scale
    severities: [0.0001, 0.001, 0.005]
    units: fraction
    scale_type: normalized_small_Doppler_or_sampling_offset_equivalent
    limit_source: pre-specified small-scale stress grid; physical interpretation reported per carrier
    applicable_when: complex_iq_verified
  - id: bandpass_response
    mathematical_transform: r=10^(ripple_db/20)-1; h=[0.25r,1,-0.25r]/abs(sum(h)); y=conv_same(x,h)
    random_variables: none
    normalization: unit_DC_gain_three_tap_FIR; zero_padding_at_convolution_boundary
    seed_policy: no_random_variable; generator_argument_ignored
    failure_conditions: finite_complex_input_and_finite_registered_severity_required
    parameter: ripple_db
    severities: [0.5, 1.0, 3.0]
    units: dB
    scale_type: physical_response_ripple
    limit_source: pre-specified receiver-response stress grid
    applicable_when: sample_rate_verified
  - id: ism_mixing
    mathematical_transform: y=x+sqrt(Px/10^(sir_db/10))*i; i=exp(j*2*pi*cumsum(f))*b
    random_variables: each_64_sample_hop_frequency_uniformly_selected_from_[.07,.13,.21,.31]; b_n_uniform_in_{-1,+1}
    normalization: synthetic_FHSS_BPSK_like_surrogate_has_unit_sample_power; no_external_donor_or_alignment
    seed_policy: numpy_generator_from_registered_base_seed; source_instability=fold_base+case_index_in_recording_id_lexicographic_order_shared_across_configurations; relation=base+1009*window_index+case_index
    failure_conditions: finite_complex_input_and_finite_registered_severity_required
    parameter: sir_db
    severities: [20, 10, 0, -10]
    units: dB
    scale_type: physical_relative_power
    limit_source: pre-specified stress grid; surrogate type must be reported
    applicable_when: declared_synthetic_surrogate_allowed
exclusions:
  - Any severity calibrated from held-target accuracy or held-target representation statistics.
  - Any nuisance lacking a deterministic seed/config hash in the real campaign.
