[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scars-uav-rf"
version = "0.1.0"
description = "Source-only representation selection and held-domain falsification for UAV RF"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.0",
  "scipy>=1.10,<1.12",
  "scikit-learn>=1.3,<1.5",
  "PyYAML>=6.0,<7",
  "h5py>=3.8,<4",
  "Pillow>=10,<11",
  "matplotlib>=3.7,<3.9",
  "xgboost>=2.0,<2.2",
  "psutil>=5.9,<7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
data = ["h5py>=3.8", "Pillow>=10.0"]
full = ["torch>=2.3,<2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
